<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Авторизация — Dexo</title>
  <meta name="theme-color" content="#131215">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20260926c">
  <script>document.documentElement.classList.add('js')</script>
</head>
<body class="has-bg dim" data-title="meta.login">
  <header id="nav"></header>

  <main class="page">
    <div class="container">
      <div class="auth">
        <h1 class="page-title" data-i18n="login.title">Авторизация</h1>
        <p class="page-sub" data-i18n="login.text">Вход и регистрация доступны только через Discord.</p>
        <button class="btn" id="discordBtn"><i class="fa-brands fa-discord"></i> <span data-i18n="login.btn">Войти через Discord</span></button>
        <p class="note" data-i18n="login.note">Демо-режим: настоящий вход через Discord появится вместе с сервером.</p>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <!-- demo: stands in for the Discord OAuth redirect until there is a backend -->
  <div class="modal-bg" id="demoModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="demoTitle">
      <h3 id="demoTitle" data-i18n="demo.title">Демо-вход</h3>
      <label for="demoName" data-i18n="demo.nick">Ник в Discord</label>
      <input class="input" id="demoName" maxlength="32" data-i18n-ph="demo.ph" placeholder="например, fri213" autocomplete="off">
      <div class="error" id="demoErr"></div>
      <div class="modal-actions">
        <button class="btn btn-dark" id="demoCancel" data-i18n="common.cancel">Отмена</button>
        <button class="btn" id="demoOk" data-i18n="common.signin">Войти</button>
      </div>
    </div>
  </div>

  <script src="assets/js/store.js?v=20260926c"></script>
  <script src="assets/js/i18n.js?v=20260926c"></script>
  <script src="assets/js/layout.js?v=20260926c"></script>
  <script>
    if (DB.me()) location.replace('cabinet.html');

    const nameInput = document.getElementById('demoName');
    const err = document.getElementById('demoErr');
    document.getElementById('discordBtn').onclick = () => openModal('demoModal');
    document.getElementById('demoCancel').onclick = () => closeModal('demoModal');

    function submit() {
      const login = nameInput.value.trim();
      if (!login) {
        err.textContent = t('demo.err');
        err.classList.add('show');
        return;
      }
      // Stable fake Discord id per nickname so signing in again finds the same account.
      let h = 0;
      for (const c of login.toLowerCase()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      DB.loginDiscord({ discordId: 'demo-' + h, login });
      location.href = 'cabinet.html';
    }
    document.getElementById('demoOk').onclick = submit;
    nameInput.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
  </script>
</body>
</html>
