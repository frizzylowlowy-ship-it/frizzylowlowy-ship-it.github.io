<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Бетонный файрвол — видео</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{ --violet:#5B4BE8; --violet2:#7B6CFF; --deep:#2A1880; --ink:#1F1838; --muted:#6B6488; --lav:#F3F1FF; --lav2:#E7E3FF; --line:#DDD8FA;
  --yellow:#FFD21A; --amber:#F4A614; --red:#F0445A; --redsoft:#FFE9EC; --teal:#10B6A0; --green:#22B573; }
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:1920px; height:1080px; overflow:hidden; background:#0E0A24; }
body{ font-family:"Manrope",sans-serif; color:var(--ink); }
#stage{ position:relative; width:1920px; height:1080px; overflow:hidden; background:#FBFAFF; }
.layer{ position:absolute; inset:0; }
.scene{ position:absolute; inset:0; overflow:hidden; display:none; }
.cam{ position:absolute; inset:0; transform-origin:50% 50%; }
.abs{ position:absolute; }
.U{ font-family:"Unbounded",sans-serif; font-weight:800; }
.bg-light{ background:#FBFAFF; } .bg-dark{ background:radial-gradient(ellipse at 50% 40%,#2B1C7A 0%,#140D3A 60%,#0B0726 100%); }
.bg-violet{ background:linear-gradient(125deg,#3A22B8,#5B4BE8 55%,#8A6BFF); } .bg-amber{ background:linear-gradient(125deg,#F4A614,#FFCB45); } .bg-teal{ background:linear-gradient(125deg,#0C9C89,#27C9B2); }
.blob{ position:absolute; border-radius:50%; filter:blur(70px); }
.word{ display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:.08em; }
.word>span{ display:inline-block; }
.phone{ position:absolute; width:430px; height:820px; border-radius:60px; background:#1F1838; padding:18px; box-shadow:0 40px 90px rgba(10,5,40,.45); }
.screen{ width:100%; height:100%; border-radius:44px; background:linear-gradient(180deg,#F4F2FF,#FFFFFF); overflow:hidden; position:relative; }
.chathead{ display:flex; align-items:center; gap:14px; padding:26px 22px 16px; border-bottom:1px solid var(--line); background:#fff; }
.ava{ width:58px; height:58px; border-radius:50%; background:#2A1880; display:grid; place-items:center; flex:none; }
.chathead b{ font-size:22px; display:block; } .chathead small{ font-size:16px; color:var(--green); font-weight:700; }
.msgs{ padding:22px 18px; display:flex; flex-direction:column; gap:16px; }
.bub{ position:relative; max-width:330px; background:#fff; border:1px solid var(--line); border-radius:24px 24px 24px 6px; padding:16px 20px; font-size:22px; font-weight:600; line-height:1.3; box-shadow:0 6px 16px rgba(40,20,120,.08); transform-origin:0 100%; }
.flagtag{ position:absolute; right:-14px; top:-18px; background:var(--red); color:#fff; font-size:15px; font-weight:800; letter-spacing:.04em; border-radius:999px; padding:5px 12px; white-space:nowrap; box-shadow:0 6px 14px rgba(240,68,90,.4); }
.chip{ display:inline-flex; align-items:center; gap:12px; border-radius:22px; padding:16px 24px; font-size:27px; font-weight:800; box-shadow:0 14px 34px rgba(40,20,120,.14); background:#fff; }
.chip small{ display:block; font-size:15px; letter-spacing:.1em; opacity:.7; font-weight:800; }
.tag{ display:inline-block; font-weight:800; border-radius:999px; padding:10px 24px; font-size:22px; letter-spacing:.08em; text-transform:uppercase; }
.thought{ position:absolute; background:#fff; border:3px solid var(--violet); border-radius:30px; padding:16px 26px; font-size:30px; font-weight:800; color:var(--deep); box-shadow:0 14px 30px rgba(60,40,160,.2); white-space:nowrap; }
.speech{ position:absolute; background:#fff; border-radius:30px; padding:22px 28px; font-size:30px; font-weight:700; line-height:1.3; box-shadow:0 14px 34px rgba(60,40,160,.2); }
.speech::after{ content:""; position:absolute; bottom:-18px; left:60px; border:18px solid transparent; border-top-color:#fff; border-bottom:0; }
.brick{ position:absolute; width:176px; height:70px; border-radius:14px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px; box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), 0 8px 18px rgba(20,10,60,.25); }
.env{ position:absolute; width:120px; height:84px; border-radius:18px; background:#fff; display:grid; place-items:center; font-size:44px; box-shadow:0 10px 24px rgba(240,68,90,.35); border:3px solid var(--red); }
.strip{ position:absolute; left:90px; right:90px; bottom:70px; display:flex; align-items:stretch; gap:0; }
.sbox{ flex:1; background:#fff; border-radius:26px; padding:20px 26px; box-shadow:0 18px 40px rgba(40,20,120,.14); border:1px solid var(--line); }
.sbox .k{ font-size:16px; font-weight:800; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; margin-bottom:6px; }
.sbox .v{ font-size:27px; font-weight:800; line-height:1.25; color:var(--deep); }
.sarrow{ width:90px; display:grid; place-items:center; }
.mtag{ position:absolute; left:90px; top:70px; }
.mnum{ display:inline-block; font-size:22px; font-weight:800; letter-spacing:.08em; padding:10px 22px; border-radius:999px; }
.mtitle{ font-family:"Unbounded"; font-weight:800; font-size:64px; color:var(--deep); margin-top:16px; line-height:1.05; }
.dotsd{ display:inline-flex; gap:10px; } .dotsd span{ width:22px; height:22px; border-radius:50%; background:var(--lav2); } .dotsd span.on{ background:var(--violet); }
#flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
#vignette{ position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(20,10,60,.10) 100%); }
</style>
</head>
<body>
<div id="stage">
  <div id="scenes" class="layer"></div>
  <div id="particles" class="layer" style="pointer-events:none"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
</div>
<script>
/* ============ helpers ============ */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eout=t=>1-Math.pow(1-t,3);
const eout5=t=>1-Math.pow(1-t,5);
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const elastic=t=>t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1;
const bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375;};
const P=(t,t0,d)=>clamp((t-t0)/d);
const $=(r,s)=>r.querySelector(s); const $$=(r,s)=>[...r.querySelectorAll(s)];
function tf(el,str){ el.style.transform=(el.dataset.base||'')+' '+str; }
function pop(el,t,t0,d=.5){ const k=P(t,t0,d); el.style.opacity=k>0?1:0; tf(el,`scale(${k>0?back(k):.001})`); return k; }
function pope(el,t,t0,d=.8){ const k=P(t,t0,d); el.style.opacity=k>0?1:0; tf(el,`scale(${k>0?elastic(k):.001})`); return k; }
function fadeUp(el,t,t0,d=.6,dist=40){ const k=eout(P(t,t0,d)); el.style.opacity=k; tf(el,`translateY(${(1-k)*dist}px)`); return k; }
function slideX(el,t,t0,d=.7,dx=200){ const k=eout5(P(t,t0,d)); el.style.opacity=k; tf(el,`translateX(${(1-k)*dx}px)`); return k; }
function fadeOut(el,t,t0,d=.4){ const k=P(t,t0,d); if(k>0) el.style.opacity=Math.min(parseFloat(el.style.opacity||1),1-k); }
// kinetic text: wraps words, reveals from bottom with stagger
function kt(text,cls=''){ return text.split(' ').map(w=>`<span class="word ${cls}"><span>${w}</span></span>`).join(' '); }
function ktAnim(root,t,t0,stag=.07,d=.55){ $$(root,'.word>span').forEach((s,i)=>{ const k=eout5(P(t,t0+i*stag,d)); s.style.transform=`translateY(${(1-k)*110}%)`; }); }
function glitch(el,t,t0,d=.45){ const k=P(t,t0,d); if(k>0&&k<1){ const j=(Math.sin(t*97)+Math.sin(t*61))*6*(1-k); el.style.textShadow=`${j}px 0 rgba(0,220,255,.8), ${-j}px 0 rgba(255,0,80,.8)`; tf(el,`translate(${j*.6}px,${Math.sin(t*83)*3*(1-k)}px)`);} else { el.style.textShadow='none'; } }
function count(el,t,t0,d,from,to,fmt=(v)=>Math.round(v)){ const k=eout(P(t,t0,d)); el.textContent=fmt(lerp(from,to,k)); }
function draw(path,t,t0,d){ const L=path.getTotalLength(); path.style.strokeDasharray=L; path.style.strokeDashoffset=L*(1-eio(P(t,t0,d))); }
/* ============ characters ============ */
const MOUTH={ neutral:"M106 168 Q120 174 134 168", smile:"M103 163 Q120 186 137 163", worried:"M107 176 Q120 164 133 176", open:"M108 164 Q120 186 132 164 Q120 170 108 164 Z", o:"M114 170 Q120 160 126 170 Q120 180 114 170 Z", grin:"M100 160 Q120 192 140 160 Q120 172 100 160 Z" };
function person(o){
  const skin=o.skin||'#FFD3B6', skinD=o.skinD||'#F2B899', hair=o.hair||'#2B2140', top=o.top||'#5B4BE8', topD=o.topD||'#4637C8';
  let hairP='';
  if(o.style==='short') hairP=`<path d="M60 132 C54 70 92 50 124 52 C164 52 190 82 182 130 C172 104 150 94 122 96 C96 97 74 108 60 132 Z" fill="${hair}"/>`;
  if(o.style==='curly') hairP=`<g fill="${hair}"><circle cx="75" cy="95" r="26"/><circle cx="105" cy="72" r="28"/><circle cx="140" cy="72" r="28"/><circle cx="168" cy="96" r="26"/><circle cx="62" cy="122" r="16"/><circle cx="180" cy="122" r="16"/></g>`;
  if(o.style==='long') hairP=`<path d="M58 140 C50 66 94 50 124 52 C160 52 194 78 184 140 L190 225 C170 232 168 205 170 150 C160 110 140 100 120 100 C98 100 80 112 72 150 C74 205 70 232 52 225 Z" fill="${hair}"/>`;
  if(o.style==='bun') hairP=`<circle cx="122" cy="50" r="24" fill="${hair}"/><path d="M60 132 C56 72 92 56 122 56 C156 56 188 76 182 132 C176 108 152 96 122 96 C94 96 70 108 60 132 Z" fill="${hair}"/>`;
  if(o.style==='cap') hairP=`<path d="M62 118 C62 72 92 56 122 56 C156 56 182 74 182 118 Z" fill="${o.cap||'#FFD21A'}"/><path d="M150 112 L214 118 Q214 128 182 126 Z" fill="${o.cap||'#FFD21A'}"/>`;
  const glasses=o.glasses?`<g fill="none" stroke="#2A1880" stroke-width="4"><circle cx="98" cy="138" r="16"/><circle cx="142" cy="138" r="16"/><path d="M114 138 L126 138"/></g>`:'';
  const badge=o.badge?`<g><circle cx="165" cy="262" r="17" fill="#FFD21A"/><path d="M165 251 L168 259 L177 259 L170 264 L172 273 L165 268 L158 273 L160 264 L153 259 L162 259 Z" fill="#2A1880"/></g>`:'';
  const phone=o.phone?`<g class="phoneInHand"><rect x="150" y="238" width="34" height="58" rx="7" fill="#1F1838"/><rect x="154" y="244" width="26" height="44" rx="4" fill="#9D8FFF" class="pscreen"/></g>`:'';
  return `<svg class="person" viewBox="0 0 240 330" width="${o.w||360}" height="${(o.w||360)*330/240}" style="overflow:visible">
  <ellipse cx="120" cy="332" rx="96" ry="10" fill="rgba(40,20,120,.12)"/>
  <g class="body">
    <path d="M24 330 C24 246 58 214 120 212 C182 214 216 246 216 330 Z" fill="${top}"/>
    <path d="M96 214 Q120 246 144 214" fill="none" stroke="${topD}" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 240 L120 330" stroke="${topD}" stroke-width="4" opacity=".5"/>
    ${badge}
    <g class="armL" style="transform-origin:62px 246px"><path d="M62 246 Q40 290 64 318" fill="none" stroke="${topD}" stroke-width="30" stroke-linecap="round"/><circle cx="66" cy="318" r="15" fill="${skin}"/></g>
    <g class="armR" style="transform-origin:178px 246px"><path d="M178 246 Q206 282 170 300" fill="none" stroke="${topD}" stroke-width="30" stroke-linecap="round"/><circle cx="168" cy="300" r="15" fill="${skin}"/>${phone}</g>
    <g class="head" style="transform-origin:120px 205px">
      <rect x="104" y="170" width="32" height="46" rx="12" fill="${skinD}"/>
      <circle cx="62" cy="142" r="12" fill="${skinD}"/><circle cx="178" cy="142" r="12" fill="${skinD}"/>
      <circle cx="120" cy="134" r="60" fill="${skin}"/>
      ${hairP}
      <circle cx="88" cy="160" r="10" fill="#FF8FA3" opacity=".35"/><circle cx="152" cy="160" r="10" fill="#FF8FA3" opacity=".35"/>
      <path class="browL" d="M86 114 Q98 108 110 114" fill="none" stroke="${hair}" stroke-width="5" stroke-linecap="round" style="transform-origin:98px 112px"/>
      <path class="browR" d="M130 114 Q142 108 154 114" fill="none" stroke="${hair}" stroke-width="5" stroke-linecap="round" style="transform-origin:142px 112px"/>
      <g class="eye" style="transform-origin:98px 138px"><ellipse cx="98" cy="138" rx="7" ry="9" fill="#1F1838"/><circle cx="100" cy="135" r="2.4" fill="#fff"/></g>
      <g class="eye" style="transform-origin:142px 138px"><ellipse cx="142" cy="138" rx="7" ry="9" fill="#1F1838"/><circle cx="144" cy="135" r="2.4" fill="#fff"/></g>
      ${glasses}
      <path class="mouth" d="${MOUTH.neutral}" fill="none" stroke="#8E2A3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="sweat" d="M188 104 Q196 118 188 124 Q180 118 188 104 Z" fill="#7FD3FF" opacity="0"/>
    </g>
  </g></svg>`;
}
function C(root){ if(root._c) return root._c; const c={
  body:$(root,'.body'), head:$(root,'.head'), eyes:$$(root,'.eye'), mouth:$(root,'.mouth'), armL:$(root,'.armL'), armR:$(root,'.armR'), browL:$(root,'.browL'), browR:$(root,'.browR'), sweat:$(root,'.sweat'),
  idle(t,seed=0,amp=1,tilt=0){ this.body.style.transform=`translateY(${Math.sin(t*2.2+seed)*5*amp}px)`; this.head.style.transform=`rotate(${Math.sin(t*1.3+seed)*3*amp+tilt}deg)`;
    const ph=(t+seed*.37)%3.1; const s=ph<.13?.1:1; this.eyes.forEach(e=>e.style.transform=`scaleY(${s})`); },
  jump(t,t0){ const k=P(t,t0,.5); if(k>0&&k<1) this.body.style.transform+=` translateY(${-Math.sin(k*Math.PI)*40}px)`; },
  mood(m){ this.mouth.setAttribute('d',MOUTH[m]); this.mouth.setAttribute('fill',(m==='open'||m==='o'||m==='grin')?'#8E2A3A':'none'); const w=m==='worried';
    this.browL.style.transform=w?'rotate(-12deg) translateY(-3px)':''; this.browR.style.transform=w?'rotate(12deg) translateY(-3px)':''; },
  talk(t,on){ if(on) this.mood(Math.floor(t*7)%2?'open':'neutral'); },
  arm(w,deg){ (w==='L'?this.armL:this.armR).style.transform=`rotate(${deg}deg)`; },
  sweatOn(k){ this.sweat.setAttribute('opacity',k); } }; root._c=c; return c; }
const RECRUITER=`<svg viewBox="0 0 60 60" width="40" height="40"><circle cx="30" cy="30" r="30" fill="#2A1880"/><path d="M12 30 Q30 14 48 30 Q30 40 12 30Z" fill="#fff"/><path d="M18 29 L27 32 M42 29 L33 32" stroke="#2A1880" stroke-width="4" stroke-linecap="round"/></svg>`;
const ARROW=`<svg width="90" height="40" viewBox="0 0 90 40"><path class="ar" d="M6 20 L72 20" stroke="#B9B1EE" stroke-width="7" stroke-linecap="round" fill="none"/><path class="ah" d="M60 8 L78 20 L60 32" stroke="#B9B1EE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
function strip(f,m,e,diff){ return `<div class="strip">
  <div class="sbox s1" style="border-top:6px solid var(--red)"><div class="k">Фактор риска</div><div class="v" style="color:#B71C33">${f}</div></div><div class="sarrow a1">${ARROW}</div>
  <div class="sbox s2" style="border-top:6px solid var(--violet)"><div class="k">Мера</div><div class="v">${m}</div></div><div class="sarrow a2">${ARROW}</div>
  <div class="sbox s3" style="border-top:6px solid var(--teal)"><div class="k">Эффект · сложность <span class="dotsd" style="vertical-align:-4px;margin-left:8px">${[1,2,3].map(i=>`<span class="${i<=diff?'on':''}"></span>`).join('')}</span></div><div class="v" style="color:#08594F">${e}</div></div></div>`; }
function stripAnim(r,t,t0){ fadeUp($(r,'.s1'),t,t0,.5,50); $$(r,'.a1 path').forEach(p=>draw(p,t,t0+.4,.4)); fadeUp($(r,'.s2'),t,t0+.7,.5,50); $$(r,'.a2 path').forEach(p=>draw(p,t,t0+1.1,.4)); fadeUp($(r,'.s3'),t,t0+1.4,.5,50); }
function mtag(n,label,title,color,bg){ return `<div class="mtag"><span class="mnum" style="background:${bg};color:${color}">${label}</span><div class="mtitle">${kt(title)}</div></div>`; }
/* ============ scene system ============ */
const S=[]; window.CUES=[];
let acc=0;
function scene(o){ const el=document.createElement('div'); el.className='scene '+(o.bg||'bg-light'); el.innerHTML=`<div class="cam">${o.html}</div>`; document.getElementById('scenes').appendChild(el);
  const sc={...o, el, cam:el.firstElementChild, start:acc}; S.push(sc); (o.cues||[]).forEach(c=>CUES.push({t:acc+c[0],s:c[1],v:c[2]??1})); acc+=o.dur; return sc; }
const T_IN=.7;
/* ---------- 0. COLD OPEN ---------- */
scene({dur:8.5,bg:'bg-dark',enter:'none',html:`
  <div class="abs" id="c-ring" style="left:960px;top:520px;width:10px;height:10px;margin:-5px;border-radius:50%;border:6px solid rgba(123,108,255,.8)"></div>
  <div class="abs" id="c-note" style="left:560px;top:380px;width:800px;background:#fff;border-radius:34px;padding:28px 34px;display:flex;gap:22px;align-items:center;box-shadow:0 40px 90px rgba(0,0,0,.45)">
    <div class="ava" style="width:84px;height:84px">${RECRUITER.replace('width="40" height="40"','width="60" height="60"')}</div>
    <div><div style="font-size:22px;font-weight:800;color:#6B6488">Подработка 💸 · сейчас</div><div id="c-txt" style="font-size:38px;font-weight:800;color:#1F1838;margin-top:6px">Есть лёгкие деньги. Нужна только твоя карта.</div></div></div>
  <div class="abs U" id="c-q" style="left:0;right:0;top:700px;text-align:center;font-size:54px;color:#fff">${kt('Что ты ответишь?')}</div>
`,cues:[[.4,'ding'],[1.9,'ding'],[3.2,'glitch'],[4.4,'riser']],
update(r,t){ const ring=$(r,'#c-ring'); const k=P(t,.3,1.4); ring.style.opacity=1-k; ring.style.transform=`scale(${1+k*80})`;
  const n=$(r,'#c-note'); const kk=pope(n,t,.35,.9); n.style.transform+=` rotate(${Math.sin(t*30)*(t>1.8&&t<2.3?2:0)}deg)`;
  glitch($(r,'#c-txt'),t,3.1,.6); ktAnim($(r,'#c-q'),t,3.8); }});
/* ---------- 1. TITLE ---------- */
scene({dur:7,bg:'bg-violet',enter:'circle',html:`
  <div class="blob" style="width:900px;height:900px;right:-300px;top:-420px;background:radial-gradient(circle,#FFD21A 0%,transparent 65%);opacity:.45"></div>
  <div class="abs" id="t-logo" style="left:50%;top:150px;width:300px;margin-left:-150px;background:#fff;border-radius:40px;padding:22px 28px;box-shadow:0 30px 60px rgba(10,5,60,.35)"><img src="logo.png" style="width:100%;display:block"></div>
  <div class="abs U" id="t-1" style="left:0;right:0;top:470px;text-align:center;font-size:120px;color:#fff;line-height:1.02">${kt('Бетонный файрвол')}</div>
  <div class="abs U" id="t-2" style="left:0;right:0;top:640px;text-align:center;font-size:56px;color:#FFD21A">${kt('3 контура защиты от вербовки')}</div>
  <div class="abs" id="t-3" style="left:0;right:0;top:780px;text-align:center"><span class="tag" style="background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.3)">Задание №3 · МБОУ СОШ № 4 · Большой Камень</span></div>
`,cues:[[0,'whoosh'],[.5,'impact'],[1.0,'pop'],[2.3,'sparkle']],
update(r,t){ pope($(r,'#t-logo'),t,.4,1); $(r,'#t-logo').style.transform+=` rotate(${Math.sin(t*2)*3}deg)`; ktAnim($(r,'#t-1'),t,.9,.1,.6); ktAnim($(r,'#t-2'),t,1.6,.06); fadeUp($(r,'#t-3'),t,2.4); }});
/* ---------- 2. PROBLEM ---------- */
scene({dur:15.5,bg:'bg-light',enter:'slide',html:`
  <div class="abs" id="p-kid" style="left:240px;top:270px">${person({style:'short',phone:true,w:520})}</div>
  <div class="phone" id="p-phone" style="left:1080px;top:120px"><div class="screen">
    <div class="chathead"><div class="ava">${RECRUITER}</div><div><b>Подработка 💸</b><small>онлайн</small></div></div>
    <div class="msgs">
      <div class="bub" id="b1">Привет! Просто прими перевод и перекинь дальше. 10% твои<span class="flagtag" id="f1">ДЕНЬГИ ЗА ПЕРЕВОД</span></div>
