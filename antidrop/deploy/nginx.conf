# /etc/nginx/sites-available/antidrop
# Домен антидроп.рф в punycode: xn--80ailthgfn.xn--p1ai
server {
    listen 80;
    server_name xn--80ailthgfn.xn--p1ai www.xn--80ailthgfn.xn--p1ai;
    return 301 https://xn--80ailthgfn.xn--p1ai$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xn--80ailthgfn.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80ailthgfn.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80ailthgfn.xn--p1ai/privkey.pem;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
