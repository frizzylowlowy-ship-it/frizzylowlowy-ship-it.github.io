<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель — ECLYPSE</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header id="nav"></header>

  <main class="page" style="padding-top:80px">
    <div class="container">
      <h1 class="page-title">Админ-панель</h1>

      <div class="auth" id="gate" hidden>
        <input class="input" type="password" id="pass" placeholder="Пароль" style="margin-bottom:14px">
        <div class="error" id="passErr">Неверный пароль</div>
        <button class="btn" id="passOk"><i class="fa-solid fa-lock-open"></i> Войти</button>
      </div>

      <div id="panel" hidden>
        <div class="stats">
          <div class="stat"><div class="info-label"><i class="fa-solid fa-users"></i> Пользователей</div><div class="info-value" id="sUsers">0</div></div>
          <div class="stat"><div class="info-label"><i class="fa-solid fa-circle"></i> Сейчас онлайн</div><div class="info-value" id="sOnline">0</div></div>
          <div class="stat"><div class="info-label"><i class="fa-solid fa-download"></i> Скачиваний</div><div class="info-value" id="sDownloads">0</div></div>
          <div class="stat"><div class="info-label"><i class="fa-solid fa-play"></i> Запусков</div><div class="info-value" id="sLaunches">0</div></div>
        </div>

        <div class="toolbar">
          <input class="input" id="search" placeholder="Поиск: логин, UID, HWID">
          <select class="input" id="filter" style="max-width:190px">
            <option value="all">Все</option>
            <option value="online">Онлайн</option>
            <option value="blocked">Заблокированные</option>
          </select>
          <button class="btn btn-dark" id="adminLogout" style="margin-left:auto"><i class="fa-solid fa-right-from-bracket"></i> Выйти</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>UID</th><th>Логин</th><th>Группа</th><th>Статус</th><th>HWID</th>
                <th>Скачал</th><th>Запусков</th><th>Последний вход</th><th>Регистрация</th><th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>

  <div class="modal-bg" id="editModal">
    <div class="modal">
      <h3>Редактировать пользователя</h3>
      <label for="eLogin">Логин</label>
      <input class="input" id="eLogin" maxlength="32">
      <label for="eGroup">Группа</label>
      <select class="input" id="eGroup">
        <option>User</option>
        <option>Admin</option>
      </select>
      <label for="eSub">Подписка</label>
      <select class="input" id="eSub">
        <option>Free</option>
      </select>
      <label for="eHwid">HWID</label>
      <input class="input mono" id="eHwid">
      <div class="modal-actions">
        <button class="btn btn-dark" id="eCancel">Отмена</button>
        <button class="btn" id="eSave">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="modal-bg" id="delModal">
    <div class="modal">
      <h3>Удалить пользователя <span id="delName"></span>?</h3>
      <div class="modal-actions">
        <button class="btn btn-dark" id="dCancel">Отмена</button>
        <button class="btn" id="dOk">Удалить</button>
      </div>
    </div>
  </div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
